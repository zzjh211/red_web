<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sun" cx="78%" cy="26%" r="34%">
      <stop offset="0%" stop-color="#F4D58A" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#E8C977" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#E8C977" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mtnBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C977" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#E8C977" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="mtnFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C977" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#E8C977" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- 曙光 -->
  <rect width="1600" height="900" fill="url(#sun)"/>
  <g stroke="#F4D58A" stroke-width="2" opacity="0.5">
    <line x1="1248" y1="234" x2="1248" y2="120"/>
    <line x1="1248" y1="234" x2="1340" y2="160"/>
    <line x1="1248" y1="234" x2="1156" y2="160"/>
    <line x1="1248" y1="234" x2="1380" y2="234"/>
    <line x1="1248" y1="234" x2="1116" y2="234"/>
    <line x1="1248" y1="234" x2="1330" y2="320"/>
    <line x1="1248" y1="234" x2="1166" y2="320"/>
  </g>
  <circle cx="1248" cy="234" r="46" fill="none" stroke="#F4D58A" stroke-width="2.5" opacity="0.7"/>

  <!-- 远山 -->
  <path d="M0 640 L180 560 L360 620 L560 520 L760 600 L980 500 L1200 590 L1420 510 L1600 600 L1600 900 L0 900 Z"
        fill="url(#mtnBack)" stroke="#E8C977" stroke-width="1.5" opacity="0.8"/>

  <!-- 近山 -->
  <path d="M0 760 L240 660 L470 740 L700 640 L940 730 L1180 630 L1420 720 L1600 660 L1600 900 L0 900 Z"
        fill="url(#mtnFront)" stroke="#F4D58A" stroke-width="2" opacity="0.9"/>

  <!-- 红旗与旗杆 -->
  <g transform="translate(300 470)">
    <line x1="0" y1="-30" x2="0" y2="300" stroke="#F4D58A" stroke-width="4" opacity="0.85"/>
    <circle cx="0" cy="-30" r="7" fill="#F4D58A" opacity="0.9"/>
    <path d="M0 0 C70 -20 120 20 180 0 C200 0 200 0 200 0 L200 110 C140 130 90 90 0 110 Z"
          fill="none" stroke="#F4D58A" stroke-width="3" opacity="0.9" stroke-linejoin="round"/>
    <path d="M18 30 l8 22 22 -2 -17 16 5 22 -18 -12 -18 12 5 -22 -17 -16 22 2 z"
          fill="#F4D58A" opacity="0.85" transform="translate(8 6) scale(0.5)"/>
  </g>

  <!-- 飘散星点 -->
  <g fill="#F4D58A" opacity="0.6">
    <circle cx="520" cy="180" r="3"/>
    <circle cx="760" cy="120" r="2"/>
    <circle cx="980" cy="210" r="3"/>
    <circle cx="1180" cy="120" r="2"/>
    <circle cx="640" cy="300" r="2"/>
    <circle cx="1020" cy="330" r="2.5"/>
  </g>
</svg>
